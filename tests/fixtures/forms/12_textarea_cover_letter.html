<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application with Cover Letter and Summary</title>
</head>
<body>
  <form id="textarea-form" action="/apply-text" method="POST">
    <label for="c_name">Name</label>
    <input type="text" id="c_name" name="name" />

    <label for="c_summary">Professional Summary</label>
    <textarea id="c_summary" name="summary" rows="4"></textarea>

    <label for="c_skills">Key Skills & Technologies</label>
    <textarea id="c_skills" name="skills" rows="3"></textarea>

    <button type="submit">Submit Details</button>
  </form>
</body>
</html>
