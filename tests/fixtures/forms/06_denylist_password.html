<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application with Account Creation</title>
</head>
<body>
  <h1>Create Portal Account & Apply</h1>
  <form id="pw-form" action="/register" method="POST">
    <label for="u_email">Email</label>
    <input type="email" id="u_email" name="email" required />

    <label for="u_pass">Create Password</label>
    <input type="password" id="u_pass" name="password" required />

    <label for="u_pass2">Confirm Password</label>
    <input type="password" id="u_pass2" name="confirm_password" required />

    <button type="submit">Register and Continue</button>
  </form>
</body>
</html>
