<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Processing Fee</title>
</head>
<body>
  <h2>Licensing Exam Application</h2>
  <form id="pay-form" action="/pay-fee" method="POST">
    <label for="c_name">Cardholder Name</label>
    <input type="text" id="c_name" name="cardholder" />

    <label for="cc_number">Credit Card Number</label>
    <input type="text" id="cc_number" name="cardnumber" />

    <label for="cc_cvv">CVV</label>
    <input type="text" id="cc_cvv" name="cvv" />

    <button type="submit">Pay & Submit</button>
  </form>
</body>
</html>
