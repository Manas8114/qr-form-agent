<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdowns and Radio Buttons</title>
</head>
<body>
  <form id="dd-form" action="/apply-stage2" method="POST">
    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">Select country</option>
      <option value="US">United States</option>
      <option value="CA">Canada</option>
      <option value="UK">United Kingdom</option>
    </select>

    <fieldset>
      <legend>Will you now or in the future require visa sponsorship?</legend>
      <label><input type="radio" name="sponsorship" value="yes" id="sponsor_yes" /> Yes</label>
      <label><input type="radio" name="sponsorship" value="no" id="sponsor_no" /> No</label>
    </fieldset>

    <button type="submit" id="btn-submit">Submit</button>
  </form>
</body>
</html>
