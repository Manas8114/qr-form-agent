<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Step Wizard Step 1</title>
  <style>
    .hidden-submit {
      display: none;
    }
  </style>
</head>
<body>
  <div class="wizard">
    <div class="step-indicator">Step 1 of 3: Basic Details</div>
    <form id="step1-form" action="/wizard/step2" method="POST">
      <label for="w_name">Full Name</label>
      <input type="text" id="w_name" name="name" required />

      <label for="w_email">Email</label>
      <input type="email" id="w_email" name="email" required />

      <button type="button" id="next-btn">Next</button>
      <button type="submit" id="final-submit" class="hidden-submit">Submit</button>
    </form>
  </div>
</body>
</html>
