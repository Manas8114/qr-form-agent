<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajax Submitting Application</title>
</head>
<body>
  <h2>Interactive Application</h2>
  <form id="ajax-form">
    <label for="ajax_name">Full Name</label>
    <input type="text" id="ajax_name" name="name" />

    <label for="ajax_email">Email</label>
    <input type="email" id="ajax_email" name="email" />

    <button type="button" id="ajax-submit-btn">Send Application</button>
  </form>

  <script>
    document.getElementById('ajax-submit-btn').addEventListener('click', async () => {
      try {
        const res = await fetch('https://example.com/api/ajax-apply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('ajax_name').value,
            email: document.getElementById('ajax_email').value
          })
        });
        window.__AJAX_SUBMIT_SUCCESS__ = res.ok;
      } catch (err) {
        window.__AJAX_SUBMIT_ERROR__ = err.message;
      }
    });
  </script>
</body>
</html>
