<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Portal with Iframe Form</title>
</head>
<body>
  <h1>Careers Portal</h1>
  <p>Please complete the application form below:</p>
  <iframe id="app-iframe" title="Application Form Frame" srcdoc='
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inner Form</title>
      </head>
      <body>
        <form id="inner-form" action="/api/inner-apply" method="POST">
          <label for="cand_email">Candidate Email</label>
          <input type="email" id="cand_email" name="email" required />
          <button type="submit" id="inner-submit">Apply via Iframe</button>
        </form>
      </body>
    </html>
  ' width="500" height="300"></iframe>
</body>
</html>
