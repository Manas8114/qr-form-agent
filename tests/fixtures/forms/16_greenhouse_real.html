<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Acme Corp - Software Engineer (Greenhouse Board)</title>
  <link rel="canonical" href="https://boards.greenhouse.io/acmecorp/jobs/123456" />
</head>
<body>
  <div id="wrapper">
    <div id="header">
      <h1>Acme Corp Careers</h1>
      <h2>Software Engineer Graduate 2026</h2>
      <div class="location">London, UK</div>
    </div>

    <form id="application_form" method="POST" action="https://boards.greenhouse.io/acmecorp/jobs/123456" enctype="multipart/form-data">
      <div class="field">
        <label for="first_name">First Name <span class="asterisk">*</span></label>
        <input type="text" id="first_name" name="job_application[first_name]" autocomplete="given-name" required />
      </div>

      <div class="field">
        <label for="last_name">Last Name <span class="asterisk">*</span></label>
        <input type="text" id="last_name" name="job_application[last_name]" autocomplete="family-name" required />
      </div>

      <div class="field">
        <label for="email">Email <span class="asterisk">*</span></label>
        <input type="email" id="email" name="job_application[email]" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="phone">Phone <span class="asterisk">*</span></label>
        <input type="tel" id="phone" name="job_application[phone]" autocomplete="tel" required />
      </div>

      <div class="field">
        <label for="resume">Resume/CV <span class="asterisk">*</span></label>
        <input type="file" id="resume" name="job_application[resume]" data-field="resume" required />
      </div>

      <div class="field">
        <label for="job_application_location">Location (City, Country)</label>
        <input type="text" id="job_application_location" name="job_application[location]" />
      </div>

      <div class="field">
        <label for="job_application_answers_attributes_0_text_value">LinkedIn Profile</label>
        <input type="url" id="job_application_answers_attributes_0_text_value" name="job_application[answers_attributes][0][text_value]" placeholder="https://linkedin.com/in/..." />
      </div>

      <div class="field">
        <label for="job_application_answers_attributes_1_text_value">Website / GitHub Profile</label>
        <input type="url" id="job_application_answers_attributes_1_text_value" name="job_application[answers_attributes][1][text_value]" placeholder="https://github.com/..." />
      </div>

      <!-- Custom question mapped from Answers Bank -->
      <div class="field">
        <label for="job_application_answers_attributes_2_text_value">Will you now or in the future require visa sponsorship?</label>
        <input type="text" id="job_application_answers_attributes_2_text_value" name="job_application[answers_attributes][2][text_value]" />
      </div>

      <div class="actions">
        <input type="submit" id="submit_app" value="Submit Application" />
      </div>
    </form>
  </div>
</body>
</html>
