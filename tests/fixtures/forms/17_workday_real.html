<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global Bank - Graduate Technology Analyst (Workday)</title>
  <link rel="canonical" href="https://globalbank.myworkdayjobs.com/Careers/job/London/Analyst_R123" />
</head>
<body>
  <div class="wd-form-container" data-automation-id="applicationPage">
    <header>
      <h1 data-automation-id="jobTitle">Graduate Technology Analyst</h1>
      <span data-automation-id="jobLocation">London, United Kingdom</span>
    </header>

    <form id="wd-apply-form" action="/apply/submit" method="POST">
      <!-- Legal Name Section -->
      <fieldset data-automation-id="legalNameSection">
        <legend>Contact Information</legend>
        <div>
          <label for="input-1">First Name *</label>
          <input type="text" id="input-1" data-automation-id="legalNameSection_firstName" name="legalNameSection_firstName" required />
        </div>
        <div>
          <label for="input-2">Last Name *</label>
          <input type="text" id="input-2" data-automation-id="legalNameSection_lastName" name="legalNameSection_lastName" required />
        </div>
        <div>
          <label for="input-3">Email Address *</label>
          <input type="email" id="input-3" data-automation-id="email" name="email" required />
        </div>
        <div>
          <label for="input-4">Phone Number *</label>
          <input type="tel" id="input-4" data-automation-id="phone-number" name="phoneNumber" required />
        </div>
      </fieldset>

      <!-- Address Section -->
      <fieldset data-automation-id="addressSection">
        <legend>Address</legend>
        <div>
          <label for="input-5">Address Line 1</label>
          <input type="text" id="input-5" data-automation-id="addressSection_addressLine1" name="addressLine1" />
        </div>
        <div>
          <label for="input-6">City</label>
          <input type="text" id="input-6" data-automation-id="addressSection_city" name="city" />
        </div>
        <div>
          <label for="input-7">Postal Code</label>
          <input type="text" id="input-7" data-automation-id="addressSection_postalCode" name="postalCode" />
        </div>
      </fieldset>

      <!-- Resume Drop Zone -->
      <div data-automation-id="resumeSection">
        <label for="resume-upload">Upload Resume / CV *</label>
        <input type="file" id="resume-upload" data-automation-id="file-upload-input-drop-zone" name="resumeFile" required />
      </div>

      <!-- Logistics / Notice Period Question -->
      <div>
        <label for="input-8">What is your current notice period?</label>
        <input type="text" id="input-8" data-automation-id="noticePeriod" name="noticePeriod" />
      </div>

      <div class="footer-actions">
        <button type="submit" data-automation-id="bottom-navigation-next-button">Submit Application</button>
      </div>
    </form>
  </div>
</body>
</html>
