<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application with Declarations and Checkboxes</title>
</head>
<body>
  <form id="cb-form" action="/apply-declarations" method="POST">
    <label for="c_email">Email</label>
    <input type="email" id="c_email" name="email" />

    <div>
      <input type="checkbox" id="work_auth" name="work_auth" />
      <label for="work_auth">I am legally authorized to work in this country.</label>
    </div>

    <div>
      <input type="checkbox" id="terms" name="terms" />
      <label for="terms">I agree to the terms and privacy policy.</label>
    </div>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
