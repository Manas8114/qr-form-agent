<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standard Job Application</title>
</head>
<body>
  <h1>Apply for Senior Engineer</h1>
  <form id="job-app-form" action="/submit-application" method="POST">
    <div>
      <label for="first_name">First Name</label>
      <input type="text" id="first_name" name="firstName" required />
    </div>
    <div>
      <label for="last_name">Last Name</label>
      <input type="text" id="last_name" name="lastName" required />
    </div>
    <div>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="applicantEmail" required />
    </div>
    <div>
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="applicantPhone" />
    </div>
    <div>
      <label for="resume">Attach Resume</label>
      <input type="file" id="resume" name="resumeFile" accept=".pdf,.doc,.docx" />
    </div>
    <button type="submit" id="submit-btn">Submit Application</button>
  </form>
</body>
</html>
