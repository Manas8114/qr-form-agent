<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Tech Society - 2026 Graduate Application (Google Forms)</title>
  <link rel="canonical" href="https://docs.google.com/forms/d/e/1FAIpQLSc123/viewform" />
</head>
<body>
  <div class="freebirdFormviewerViewFormCard">
    <div class="freebirdFormviewerViewHeaderHeader">
      <div class="freebirdFormviewerViewHeaderTitle">2026 Graduate Tech Application Form</div>
      <div class="freebirdFormviewerViewHeaderDescription">Please fill in your details below.</div>
    </div>

    <form action="https://docs.google.com/forms/d/e/1FAIpQLSc123/formResponse" method="POST">
      <div role="list" class="freebirdFormviewerViewItemList">
        <!-- Item 1: Full Name -->
      <div role="listitem" class="freebirdFormviewerViewItemsItemItem">
        <div class="freebirdFormviewerViewItemsItemItemHeader">
          <div class="freebirdFormviewerViewItemsItemItemTitle" id="i1">What is your full name? *</div>
        </div>
        <div class="quantumWizTextinputPaperinputInputArea">
          <input type="text" class="quantumWizTextinputPaperinputInput" aria-labelledby="i1" name="entry.1000001" required />
        </div>
      </div>

      <!-- Item 2: Email Address -->
      <div role="listitem" class="freebirdFormviewerViewItemsItemItem">
        <div class="freebirdFormviewerViewItemsItemItemHeader">
          <div class="freebirdFormviewerViewItemsItemItemTitle" id="i2">Email address *</div>
        </div>
        <div class="quantumWizTextinputPaperinputInputArea">
          <input type="email" class="quantumWizTextinputPaperinputInput" aria-labelledby="i2" name="entry.1000002" required />
        </div>
      </div>

      <!-- Item 3: Phone Number -->
      <div role="listitem" class="freebirdFormviewerViewItemsItemItem">
        <div class="freebirdFormviewerViewItemsItemItemHeader">
          <div class="freebirdFormviewerViewItemsItemItemTitle" id="i3">Phone number</div>
        </div>
        <div class="quantumWizTextinputPaperinputInputArea">
          <input type="tel" class="quantumWizTextinputPaperinputInput" aria-labelledby="i3" name="entry.1000003" />
        </div>
      </div>

      <!-- Item 4: LinkedIn Profile -->
      <div role="listitem" class="freebirdFormviewerViewItemsItemItem">
        <div class="freebirdFormviewerViewItemsItemItemHeader">
          <div class="freebirdFormviewerViewItemsItemItemTitle" id="i4">LinkedIn Profile URL</div>
        </div>
        <div class="quantumWizTextinputPaperinputInputArea">
          <input type="url" class="quantumWizTextinputPaperinputInput" aria-labelledby="i4" name="entry.1000004" />
        </div>
      </div>

      <!-- Item 5: Notice Period -->
      <div role="listitem" class="freebirdFormviewerViewItemsItemItem">
        <div class="freebirdFormviewerViewItemsItemItemHeader">
          <div class="freebirdFormviewerViewItemsItemItemTitle" id="i5">What is your current notice period?</div>
        </div>
        <div class="quantumWizTextinputPaperinputInputArea">
          <input type="text" class="quantumWizTextinputPaperinputInput" aria-labelledby="i5" name="entry.1000005" />
        </div>
      </div>
      </div>

      <div class="freebirdFormviewerViewNavigationNavControls">
        <input type="submit" name="submit" value="Submit" class="quantumWizButtonPaperbuttonEl" />
      </div>
    </form>
  </div>
</body>
</html>
